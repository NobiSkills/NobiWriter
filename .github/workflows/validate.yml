name: Validate repository
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_repository.py
      - run: python skills/nobiwriter/tests/check_bundle.py
      - run: python -m unittest discover -s skills/nobiwriter/tests -p 'test_*.py' -v
      - run: python scripts/package_skill.py
      - uses: actions/upload-artifact@v4
        with:
          name: nobiwriter-skill
          path: dist/skill.zip
          if-no-files-found: error
